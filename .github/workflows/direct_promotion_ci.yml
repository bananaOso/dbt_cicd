name: "Direct Promotion: CI - dbt Build on PR"

on:
  pull_request:
    branches: [main]

env:
  DBT_PROFILES_DIR: .
  SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
  SNOWFLAKE_USER: ${{ secrets.SNOWFLAKE_USER }}
  SNOWFLAKE_PASSWORD: ${{ secrets.SNOWFLAKE_PASSWORD }}
  SNOWFLAKE_WAREHOUSE: ${{ secrets.SNOWFLAKE_WAREHOUSE }}

jobs:
  dbt-ci:
    name: "dbt build (CI schema: CI_PR_${{ github.event.pull_request.number }})"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dbt
        run: pip install dbt-snowflake

      - name: Install dbt packages
        run: dbt deps

      - name: Generate CI profiles.yml
        run: |
          cat > profiles.yml <<EOF
          tasty_bytes:
            target: ci
            outputs:
              ci:
                type: snowflake
                account: "${SNOWFLAKE_ACCOUNT}"
                user: "${SNOWFLAKE_USER}"
                password: "${SNOWFLAKE_PASSWORD}"
                role: ACCOUNTADMIN
                database: DBT_TASTY_BYTES
                warehouse: "${SNOWFLAKE_WAREHOUSE}"
                schema: CI_PR_${{ github.event.pull_request.number }}
                threads: 4
          EOF

      - name: dbt build (run + test)
        run: dbt build

      - name: Upload dbt artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dbt-ci-artifacts
          path: |
            target/manifest.json
            target/run_results.json

  cleanup-ci-schema:
    name: "Drop CI schema on merge"
    runs-on: ubuntu-latest
    if: github.event.action == 'closed' && github.event.pull_request.merged == true
    steps:
      - name: Drop CI schema
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install snowflake connector
        run: pip install snowflake-connector-python

      - name: Drop schema
        run: |
          python -c "
          import snowflake.connector
          conn = snowflake.connector.connect(
              account='${SNOWFLAKE_ACCOUNT}',
              user='${SNOWFLAKE_USER}',
              password='${SNOWFLAKE_PASSWORD}',
              warehouse='${SNOWFLAKE_WAREHOUSE}'
          )
          conn.cursor().execute('DROP SCHEMA IF EXISTS DBT_TASTY_BYTES.CI_PR_${{ github.event.pull_request.number }}')
          conn.close()
          "
