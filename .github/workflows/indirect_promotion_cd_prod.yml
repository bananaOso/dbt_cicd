name: "Indirect Promotion: CD - Deploy to Production (Release)"

on:
  push:
    branches: [main]

env:
  DBT_PROFILES_DIR: .
  SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
  SNOWFLAKE_USER: ${{ secrets.SNOWFLAKE_USER }}
  SNOWFLAKE_PASSWORD: ${{ secrets.SNOWFLAKE_PASSWORD }}
  SNOWFLAKE_WAREHOUSE: ${{ secrets.SNOWFLAKE_WAREHOUSE }}

jobs:
  dbt-deploy-prod:
    name: "dbt run + test (Production)"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dbt
        run: pip install dbt-snowflake

      - name: Install dbt packages
        run: dbt deps

      - name: Generate Production profiles.yml
        run: |
          cat > profiles.yml <<EOF
          tasty_bytes:
            target: prod
            outputs:
              prod:
                type: snowflake
                account: "${SNOWFLAKE_ACCOUNT}"
                user: "${SNOWFLAKE_USER}"
                password: "${SNOWFLAKE_PASSWORD}"
                role: ACCOUNTADMIN
                database: DBT_TASTY_BYTES
                warehouse: "${SNOWFLAKE_WAREHOUSE}"
                schema: PROD_DBT
                threads: 4
          EOF

      - name: dbt run (Production)
        run: dbt run

      - name: dbt test (Production)
        run: dbt test

      - name: Generate dbt docs
        run: dbt docs generate

      - name: Upload dbt artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dbt-prod-artifacts
          path: |
            target/manifest.json
            target/run_results.json
            target/catalog.json
